name: Release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: MdReader-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            archive: MdReader-linux-x64.tar.gz
          - os: macos-latest
            rid: osx-arm64
            archive: MdReader-osx-arm64.tar.gz
          - os: macos-latest
            rid: osx-x64
            archive: MdReader-osx-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1 | tr -d '[:space:]')
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >
          dotnet publish MdReader.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o out/${{ matrix.rid }}

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path out/${{ matrix.rid }}/* -DestinationPath ${{ matrix.archive }}

      - name: Archive (macOS and Linux)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C out/${{ matrix.rid }} .

      - uses: actions/upload-artifact@v4
        with:
          name: MdReader-${{ matrix.rid }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MD Reader ${{ steps.version.outputs.version }}
          body: |
            **MD Reader ${{ steps.version.outputs.version }}**

            نسخه‌ی آماده‌ی اجرا برای ویندوز، لینوکس و مک (self-contained؛ نیازی به نصب .NET روی سیستم مقصد نیست).

            **ویندوز:** `MdReaderSetup.exe` برنامه را نصب می‌کند و فایل‌های `.md` را به آن نسبت می‌دهد (بدون نیاز به دسترسی ادمین). فایل `MdReader-win-x64.zip` نسخه‌ی بدون نصب است.

            **اندروید:** فایل `com.smrmoosavi.mdreader-Signed.apk` روی گوشی اندروید ۷ (API 24) و بالاتر نصب می‌شود؛ برای نصب باید «نصب از منابع نامشخص» را برای مرورگر یا فایل‌منیجر اجازه بدهید.
          files: ${{ matrix.archive }}
          generate_release_notes: true

  android:
    name: android-apk
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Avalonia 12's Android build targets net10.0-android, so this job needs the .NET 10 SDK
      # plus the android workload and a JDK.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Publish APK
        run: >
          dotnet publish MdReader.Android/MdReader.Android.csproj
          -c Release
          -f net10.0-android
          -p:AndroidPackageFormats=apk
          -o out/android

      # Release builds without a keystore are signed with the auto-generated debug key, which
      # is enough for sideloading. Publishing also leaves the unsigned APK next to it, so only
      # the signed one (*-Signed.apk) is uploaded: the unsigned file cannot be installed.
      - uses: actions/upload-artifact@v4
        with:
          name: MdReader-android
          path: out/android/*-Signed.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/android/*-Signed.apk

  installer:
    name: windows-installer
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The installer embeds the published win-x64 build as payload.zip, and that zip is
      # exactly the Windows release archive.
      - uses: actions/download-artifact@v4
        with:
          name: MdReader-win-x64
          path: Installer

      - name: Prepare payload
        shell: pwsh
        run: Move-Item Installer/MdReader-win-x64.zip Installer/payload.zip

      # Installer/ is a WPF project that targets net10.0-windows.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build installer
        shell: pwsh
        run: >
          dotnet publish Installer/Installer.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o Installer/dist

      - uses: actions/upload-artifact@v4
        with:
          name: MdReaderSetup-win-x64
          path: Installer/dist/MdReaderSetup.exe
          if-no-files-found: error

      # Release name/body/notes come from the build job; this only adds the asset.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Installer/dist/MdReaderSetup.exe
